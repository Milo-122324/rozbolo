<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RozBolo - Daily Status & Videos</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#ff416c,#ff8a00);
  color:white;
  padding:24px 16px;
  border-radius:0 0 28px 28px;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  font-size:15px;
}

.search{
  width:100%;
  padding:15px 18px;
  border:0;
  border-radius:30px;
  margin-top:18px;
  font-size:16px;
  outline:none;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:15px 12px;
  background:white;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px #00000015;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  border:0;
  background:#f0f1f5;
  padding:11px 16px;
  border-radius:22px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.cat.active{
  background:#ff416c;
  color:white;
}

.container{
  padding:18px 14px 50px;
}

.title{
  font-size:24px;
  margin:5px 0 15px;
}

.day-info{
  background:white;
  padding:14px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0000000d;
}

.video-card{
  background:white;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:22px;
  box-shadow:0 4px 18px #00000012;
}

.preview{
  min-height:300px;
  padding:25px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  position:relative;
}

.preview h2{
  font-size:28px;
  margin:15px 0;
  line-height:1.35;
}

.preview p{
  font-size:16px;
}

.profile{
  position:absolute;
  left:18px;
  bottom:15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.profile img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid white;
  background:white;
}

.profile-name{
  font-weight:bold;
  font-size:17px;
  text-shadow:0 1px 4px #000;
}

.card-body{
  padding:15px;
}

.card-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.card-desc{
  color:#777;
  margin-bottom:13px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

button{
  cursor:pointer;
}

.watch{
  width:100%;
  border:0;
  background:#ff1744;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

.share{
  flex:1;
  min-width:100px;
  border:0;
  padding:10px;
  border-radius:10px;
  background:#f0f1f5;
  font-weight:bold;
}

.profile-box{
  background:white;
  padding:18px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 3px 14px #00000010;
}

.profile-box h3{
  margin-bottom:12px;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.profile-row img{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
}

.input{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
}

.save{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#ff416c;
  color:white;
  font-weight:bold;
}

.hidden{
  display:none;
}

.empty{
  background:white;
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">RozBolo</div>
  <div class="subtitle">Daily Status & Videos ❤️</div>
  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Good Morning, Bhakti, Birthday..."
    oninput="searchVideos()">
</header>

<div class="categories">
  <button class="cat active" onclick="setCategory('All',this)">All</button>
  <button class="cat" onclick="setCategory('Good Morning',this)">🌅 Good Morning</button>
  <button class="cat" onclick="setCategory('Good Night',this)">🌙 Good Night</button>
  <button class="cat" onclick="setCategory('Devotional',this)">🙏 Devotional</button>
  <button class="cat" onclick="setCategory('Suvichar',this)">💭 Suvichar</button>
  <button class="cat" onclick="setCategory('Birthday',this)">🎂 Birthday</button>
  <button class="cat" onclick="setCategory('Anniversary',this)">💍 Anniversary</button>
  <button class="cat" onclick="setCategory('Festival',this)">🪔 Festival</button>
</div>

<main class="container">

  <div class="day-info">
    📅 <b id="today"></b><br>
    🙏 आज की विशेष भक्ति: <b id="dayBhakti"></b>
  </div>

  <div class="profile-box">
    <h3>👤 मेरी Profile</h3>

    <div class="profile-row">
      <img id="profilePreview"
           src="https://i.pravatar.cc/150?img=12"
           alt="Profile">

      <div>
        <b id="profileNamePreview">RozBolo User</b><br>
        <small>यह नाम और फोटो वीडियो पर अपने-आप दिखेगा</small>
      </div>
    </div>

    <input id="nameInput"
           class="input"
           placeholder="अपना नाम लिखें">

    <input id="photoInput"
           class="input"
           type="file"
           accept="image/*">

    <button class="save" onclick="saveProfile()">
      Profile Save करें
    </button>
  </div>

  <h1 class="title">आज के Status & Videos</h1>

  <div id="videoList"></div>

</main>

<script>

const defaultPhoto =
"https://i.pravatar.cc/150?img=12";

let profile = {
  name:localStorage.getItem("rozboloName") || "RozBolo User",
  photo:localStorage.getItem("rozboloPhoto") || defaultPhoto
};

let currentCategory = "All";

const dayNames = [
  "रविवार",
  "सोमवार",
  "मंगलवार",
  "बुधवार",
  "गुरुवार",
  "शुक्रवार",
  "शनिवार"
];

const bhakti = [
  "सूर्य देव",
  "शिव जी",
  "हनुमान जी",
  "गणेश जी",
  "विष्णु जी / श्री कृष्ण",
  "माता लक्ष्मी",
  "शनि देव / हनुमान जी"
];

function getToday(){
  const d = new Date();

  document.getElementById("today").innerText =
    d.toLocaleDateString("hi-IN",{
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    });

  document.getElementById("dayBhakti").innerText =
    bhakti[d.getDay()];
}

function festivalToday(){

  const d = new Date();
  const key =
    d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();

  const festivals = {

    "2026-10-6":
      "🙏 इंदिरा एकादशी",

    "2026-10-11":
      "🌺 शारदीय नवरात्रि आरंभ",

    "2026-10-16":
      "📚 सरस्वती आवाहन",

    "2026-10-17":
      "📚 सरस्वती पूजा",

    "2026-10-19":
      "🌺 दुर्गा अष्टमी / महानवमी",

    "2026-10-20":
      "🚩 विजयादशमी / दशहरा",

    "2026-10-25":
      "🌕 शरद पूर्णिमा",

    "2026-10-29":
      "💐 करवा चौथ"
  };

  return festivals[key] || "आज का विशेष Festival";
}

function getVideos(){

  const d = new Date();

  const dailyNumber =
    d.getDate() + d.getMonth()*31;

  const morningMessages = [
    "नई सुबह नई उम्मीद लेकर आई है ❤️",
    "आज का दिन खुशियों से भर जाए 🌸",
    "आपका आज का दिन शुभ और सुंदर हो 🙏",
    "हर सुबह नई शुरुआत का संदेश देती है 🌅"
  ];

  const nightMessages = [
    "शुभ रात्रि 🌙 मीठे सपनों के साथ सोइए",
    "दिन की सारी चिंता छोड़कर मुस्कुराइए ❤️",
    "भगवान आपके परिवार को खुश रखें 🙏",
    "कल का दिन आज से भी अच्छा हो 🌙"
  ];

  const suvichar = [
    "अच्छे विचार जीवन को सुंदर बना देते हैं।",
    "मेहनत कभी व्यर्थ नहीं जाती।",
    "समय की कदर करने वाला व्यक्ति आगे बढ़ता है।",
    "मुस्कान छोटी है लेकिन असर बड़ा करती है।"
  ];

  return [

    {
      type:"Good Morning",
      title:"🌅 Good Morning",
      text:morningMessages[dailyNumber % morningMessages.length],
      emoji:"🌅",
      color:"linear-gradient(135deg,#ff9966,#ff5e62)"
    },

    {
      type:"Good Night",
      title:"🌙 Good Night",
      text:nightMessages[dailyNumber % nightMessages.length],
      emoji:"🌙",
      color:"linear-gradient(135deg,#141e30,#243b55)"
    },

    {
      type:"Devotional",
      title:"🙏 आज की भक्ति",
      text:"आज " + bhakti[d.getDay()] + " का विशेष संदेश",
      emoji:"🙏",
      color:"linear-gradient(135deg,#7b2ff7,#f107a3)"
    },

    {
      type:"Suvichar",
      title:"💭 आज का सुविचार",
      text:suvichar[dailyNumber % suvichar.length],
      emoji:"💭",
      color:"linear-gradient(135deg,#11998e,#38ef7d)"
    },

    {
      type:"Festival",
      title:"🪔 Festival / Trending",
      text:festivalToday(),
      emoji:"🪔",
      color:"linear-gradient(135deg,#f7971e,#ffd200)"
    },

    {
      type:"Birthday",
      title:"🎂 Birthday Status",
      text:"जन्मदिन की ढेरों शुभकामनाएँ 🎉",
      emoji:"🎂",
      color:"linear-gradient(135deg,#ff416c,#ff4b2b)"
    },

    {
      type:"Anniversary",
      title:"💍 Anniversary Status",
      text:"आप दोनों का साथ हमेशा खुशियों से भरा रहे ❤️",
      emoji:"💍",
      color:"linear-gradient(135deg,#8e2de2,#4a00e0)"
    }

  ];
}

function renderVideos(list){

  const box = document.getElementById("videoList");

  box.innerHTML = "";

  if(list.length === 0){
    box.innerHTML =
      '<div class="empty">😔 कोई Status नहीं मिला।<br>दूसरा शब्द search करें।</div>';
    return;
  }

  list.forEach((video,index)=>{

    const card = document.createElement("div");
    card.className = "video-card";

    card.innerHTML = `

      <div class="preview"
           style="background:${video.color}">

        <div style="font-size:60px">
          ${video.emoji}
        </div>

        <h2>${video.text}</h2>

        <p>${video.title}</p>

        <div class="profile">

          <img src="${profile.photo}"
               alt="Profile">

          <div class="profile-name">
            ${profile.name}
          </div>

        </div>

      </div>

      <div class="card-body">

        <div class="card-title">
          ${video.title}
        </div>

        <div class="card-desc">
          आज के लिए खास Status
        </div>

        <div class="buttons">

          <button class="watch"
             onclick="watchVideo('${encodeURIComponent(video.title)}')">
             ▶️ Video देखें
          </button>

          <button class="share"
             onclick="shareVideo(${index})">
             📤 Share
          </button>

          <button class="share"
             onclick="shareWhatsApp(${index})">
             🟢 WhatsApp
          </button>

          <button class="share"
             onclick="shareFacebook()">
             🔵 Facebook
          </button>

        </div>

      </div>
    `;

    box.appendChild(card);

  });
}

function setCategory(category,button){

  currentCategory = category;

  document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  filterVideos();
}

function filterVideos(){

  const all = getVideos();

  if(currentCategory === "All"){
    renderVideos(all);
    return;
  }

  renderVideos(
    all.filter(x=>x.type === currentCategory)
  );
}

function searchVideos(){

  const word =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  let list = getVideos();

  if(currentCategory !== "All"){
    list = list.filter(
      x=>x.type === currentCategory
    );
  }

  if(word){
    list = list.filter(x=>
      (
        x.type+" "+
        x.title+" "+
        x.text
      ).toLowerCase().includes(word)
    );
  }

  renderVideos(list);
}

function watchVideo(title){

  const search =
    decodeURIComponent(title);

  const url =
    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(
      "Hindi status video "+search
    );

  window.open(url,"_blank");
}

function shareVideo(index){

  const videos = getVideos();
  const video = videos[index];

  const text =
    video.title+" - "+video.text+
    "\n\nRozBolo ❤️";

  if(navigator.share){

    navigator.share({
      title:video.title,
      text:text,
      url:location.href
    }).catch(()=>{});

  }else{

    navigator.clipboard.writeText(
      text+"\n"+location.href
    );

    alert("Share text copy हो गया ❤️");
  }
}

function shareWhatsApp(index){

  const video = getVideos()[index];

  const text =
    video.title+" - "+video.text+
    "\n\nRozBolo ❤️";

  window.open(
    "https://wa.me/?text="+
    encodeURIComponent(text+" "+location.href),
    "_blank"
  );
}

function shareFacebook(){

  window.open(
    "https://www.facebook.com/sharer/sharer.php?u="+
    encodeURIComponent(location.href),
    "_blank"
  );
}

function saveProfile(){

  const name =
    document.getElementById("nameInput").value.trim();

  if(name){
    profile.name = name;
    localStorage.setItem("rozboloName",name);
  }

  const file =
    document.getElementById("photoInput").files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      profile.photo = e.target.result;

      localStorage.setItem(
        "rozboloPhoto",
        profile.photo
      );

      updateProfile();
      filterVideos();
    };

    reader.readAsDataURL(file);

  }else{

    updateProfile();
    filterVideos();
  }

  alert("Profile Save हो गई ❤️");
}

function updateProfile(){

  document.getElementById(
    "profilePreview"
  ).src = profile.photo;

  document.getElementById(
    "profileNamePreview"
  ).innerText = profile.name;

  document.getElementById(
    "nameInput"
  ).value = profile.name;
}

getToday();
updateProfile();
filterVideos();

</script>

</body>
</html>
